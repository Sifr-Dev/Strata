name: ci
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: strata-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - run: java -jar core/target/strata-0.1.0.jar "$RUNNER_TEMP/strata-smoke" put ci works
      - run: test "$(java -jar core/target/strata-0.1.0.jar "$RUNNER_TEMP/strata-smoke" get ci)" = works
      - run: java -jar benchmarks/target/strata-benchmarks-0.1.0.jar -l
